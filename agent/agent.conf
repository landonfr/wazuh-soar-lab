<!-- Shuffle SOAR lab: real-time FIM on a test folder. New files trigger rule 554 -> Shuffle webhook. -->
<agent_config os="Windows">
  <syscheck>
    <directories realtime="yes" check_all="yes">C:\Users\YOUR_USER\WazuhTest</directories>
  </syscheck>

  <!-- Windows Defender detections (event 1116 -> rule 62123, 1118 -> 62125, 1119 -> 62126) -->
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>
